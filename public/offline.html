<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabMind AI — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0b08;
      color: #e8c87a;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #c8860a;
      margin-bottom: 12px;
    }
    p { font-size: 14px; color: #7a6a50; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      background: #c8860a;
      color: #0d0b08;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .divider {
      width: 48px; height: 2px;
      background: #c8860a;
      margin: 20px auto;
      opacity: 0.4;
    }
    .features {
      display: flex; gap: 20px;
      margin-top: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .feature {
      background: rgba(200,134,10,0.08);
      border: 1px solid rgba(200,134,10,0.2);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 13px;
      color: #c8860a;
    }
  </style>
</head>
<body>
  <div class="icon">⚕️</div>
  <h1>LabMind AI</h1>
  <div class="divider"></div>
  <p>You are currently offline.<br>
     Some features require an internet connection.</p>
  <p style="color:#555; font-size:12px;">
    The following features are available offline:
  </p>
  <div class="features">
    <div class="feature">📚 Saved Books</div>
    <div class="feature">🔬 Lab Results</div>
    <div class="feature">📊 Your Progress</div>
    <div class="feature">⭐ Your Ratings</div>
  </div>
  <div class="divider"></div>
  <button class="btn" onclick="window.location.reload()">
    Try Again →
  </button>
</body>
</html>
