      /* ── Mobile Touch Fix ── */
      *, *::before, *::after {
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        touch-action: manipulation;
        -webkit-touch-callout: none;
      }
      button, a, [role="button"], input, select, textarea, label {
        touch-action: manipulation;
        cursor: pointer;
      }
    </style>
